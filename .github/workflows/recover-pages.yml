name: Release blocked Nirootan GitHub Pages deployment
on:
  push:
    paths:
      - .github/workflows/recover-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  deployments: write
jobs:
  unlock-stale-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages publish and inactivate its deployment record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'Canceling stale Pages publish by commit identifier'
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/deployments/93e56184edaa1a3e739a8ae9b036d7d5cc106f3a/cancel"
          echo 'Latest status of stale deployment before cleanup:'
          gh api "repos/${GITHUB_REPOSITORY}/deployments/7470332203/statuses?per_page=1" --jq '.[0] | {id,state,created_at}'
          echo 'Mark stale deployment inactive (not repository or source files):'
          gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments/7470332203/statuses" -f state=inactive -f description='Clear stale GitHub Pages deployment lock' -F auto_inactive=false --jq '{id, state, created_at}'
          echo 'Delete stale deployment record only:'
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/deployments/7470332203"
          echo 'Stale deployment deleted; re-trigger Pages from main.'
      - name: Confirm site registration and old record removal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{html_url, status, source}' || true
          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=12" --jq '[.[]|{id,sha}]'
