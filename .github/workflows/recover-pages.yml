name: Diagnose Nirootan GitHub Pages publication
on:
  push:
    paths:
      - .github/workflows/recover-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  deployments: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check public website HTTP response
        run: |
          set +e
          curl -L --silent --show-error --max-time 15 --output /tmp/nirootan-page.html --write-out 'Site HTTP status: %{http_code}; redirect: %{url_effective}; bytes: %{size_download}\n' https://saaiet.github.io/nirootan/
          head -c 220 /tmp/nirootan-page.html
          echo
      - name: Query GitHub Pages and stale deployment states
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '--- Site status ---'
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{html_url, status, source, public, https_enforced}' || true
          echo '--- Pages deployments endpoint ---'
          gh api "repos/${GITHUB_REPOSITORY}/pages/deployments" --jq '.[] | {id, status, commit_sha}' || true
          echo '--- Environment ---'
          gh api "repos/${GITHUB_REPOSITORY}/environments/github-pages" --jq '{name, protection_rules, deployment_branch_policy}' || true
          echo '--- All deployments and latest statuses ---'
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=12" --jq '.[].id'); do
            echo "--- deployment $id ---"
            gh api "repos/${GITHUB_REPOSITORY}/deployments/$id" --jq '{id, sha, environment, original_environment, task, created_at, updated_at}' || true
            gh api "repos/${GITHUB_REPOSITORY}/deployments/$id/statuses?per_page=3" --jq '.[]|{id, state, description, created_at, environment_url}' || true
          done
