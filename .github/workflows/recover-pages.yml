name: Diagnose and recover stuck Nirootan Pages deployment
on:
  push:
    paths:
      - .github/workflows/recover-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  deployments: write
jobs:
  diagnose-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pages configuration and deployment history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'GitHub Pages configuration:'
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{url, status, source}' || true
          echo 'GitHub Pages deployments:'
          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=8" --jq '.[] | {id, sha, environment, created_at}' || true
      - name: Cancel blocking Pages deployment 93e5618
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/deployments/93e56184edaa1a3e739a8ae9b036d7d5cc106f3a/cancel"
          echo 'Official Pages cancellation endpoint returned success.'
      - name: Inspect deployments after cancellation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=8" --jq '.[] | {id, sha, environment, created_at}' || true
